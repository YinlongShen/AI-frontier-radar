# 领域定义。每篇论文会按 title+abstract 命中的关键词打分，
# 得分最高的领域作为主领域，其余超过 secondary_threshold 的作为次领域。
#
# strong: 权重 3.0（几乎可以单独定性）
# weak:   权重 1.0（辅助证据）
# 全部按「词边界 + 大小写不敏感」匹配，可以直接写正则。

meta:
  secondary_threshold: 3.0
  min_score_to_classify: 1.0
  fallback_topic: misc

