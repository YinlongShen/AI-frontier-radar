# ===========================================================================
# 权威研究者 / 顶级实验室 watchlist
# ---------------------------------------------------------------------------
# 命中这里的人 = 走「长窗口」（默认 180 天）+ 高权重，即使论文是几个月前发的，
# 只要还没推送过就会出现在当日 digest 的「重点关注」里。
#
# affiliation 只用于展示和分组，可能过时；匹配完全按 name + aliases 做。
# weight: 3.0 = 出手必看；2.0 = 高度关注；1.5 = 常规关注
# arxiv_query: 可选，覆盖默认的 au:"<name>" 查询
# ===========================================================================

defaults:
  weight: 2.0
  window_days: 180

