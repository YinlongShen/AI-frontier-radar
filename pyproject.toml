[project]
name = "ai-frontier-radar"
version = "0.1.0"
description = "每日 AI 前沿雷达：盯住权威研究者与顶级实验室的新想法，按领域归类成一份可以三分钟读完的简报"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "httpx>=0.27",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aidigest = "aidigest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aidigest*"]
